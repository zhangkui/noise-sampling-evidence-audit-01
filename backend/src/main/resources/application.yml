server:
  port: 8080

spring:
  application:
    name: noise-evidence-chain
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:noise_chain}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:noise}
    password: ${MYSQL_PASSWORD:noise_pass_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 可通过环境变量覆盖；默认值仅供本地/演示使用
    secret: ${JWT_SECRET:ZGVtby1ub2lzZS1ldmlkZW5jZS1jaGFpbi1zZWNyZXQta2V5LTIwMjYtbG9uZy1lbm91Z2g}
    expire-seconds: 86400
  noise:
    # 超过该分贝值自动生成异常事件
    anomaly-threshold: 85
  init:
    # 启动时初始化演示数据（空库时）
    demo-data: true

logging:
  level:
    com.citynoise: info
